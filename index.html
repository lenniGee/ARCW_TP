<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ARCW Training</title>
  <meta name="description" content="Trainingsplan und Trainingsprotokoll">
  <meta name="theme-color" content="#333333">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARCW">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true"><img src="icons/arcw-logo.png" alt=""></div>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>ARCW Training</span></div>
    <div class="who" id="who"></div>
  </header>
  <main id="app"><div class="loading">Lädt …</div></main>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=2"></script>
  <script src="app.js?v=9"></script>
  <script>
    // Startbildschirm: mind. 1,2 s zeigen, dann ausblenden sobald die App geladen hat (max. 4 s)
    (function () {
      var t0 = Date.now(), sp = document.getElementById('splash');
      (function check() {
        var dt = Date.now() - t0, busy = document.querySelector('#app > .loading');
        if (dt < 1200 || (busy && dt < 4000)) return setTimeout(check, 100);
        sp.classList.add('hide');
        setTimeout(function () { sp.remove(); }, 400);
      })();
    })();
  </script>
</body>
</html>
